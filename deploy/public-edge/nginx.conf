# stump-edge: the only way into Stump. Public access version (design: research/2026-11-11-stump-public-access-design.md).
#   :8080 "home"   -> host 0.0.0.0:10801 (IPv4)  LAN, localhost (book-curator), tailnet (`tailscale serve` :10802)
#   :8081 "public" -> host 127.0.0.1:10803       Tailscale Funnel only (https://g3.tail3e401.ts.net:8443)
# Stump itself publishes no host port, so nothing reaches it without passing here.
#
# What changes against the previous config (edge/nginx.conf.bak-*):
#  * the device pass is checked by stump-gate.js (a copy of the reviewed iaboy-gate.js): revoked
#    devices and budget resets come from a state file the APP writes (/etc/nginx/state/state.json,
#    read-only here) and this edge follows once a second: no reload, no control endpoint. Until the
#    first good read every pass is refused. `revoked.map` stays as a break-glass for the terminal
#    (`<device-name> 1;` + reload); `edge-common/invite.sh stump …` links are accepted by the app.
#  * invite pages (/api/_i/…) are the app's: GET shows a button and spends nothing, POST redeems
#    and sets the pass. They have their own header set (no pass renewal, so the new pass is not
#    overwritten) and their request line never reaches a log.
#  * what Stump is told (R2/N1): every public request carries `X-Edge-Public: 1`, and
#    `X-Edge-Pass: <cookie value>` only for a valid, unrevoked pass. They are set ONCE per server,
#    at server level, and no location sets a proxy_set_header of its own (a location that did would
#    drop every inherited one: nginx replaces, not merges). The home listener sets both to "".
#    Stump verifies the pass again with the same key.
#  * the home listener answers 404 to anything that carries Tailscale's Funnel header, so that if
#    Funnel were ever pointed at :10801 by mistake the unprotected listener would not serve the
#    internet. (`tailscale serve` traffic on :10802 does not carry it: the deploy checks.)
#  * friends' books come in over ONE route, `POST /api/v2/intake/upload` (the "Add books" inbox),
#    which has a location of its own on the public listener: a body as big as Stump's per-request
#    limit (`intake_max_request_mb`, 300 by default, +1 MB of multipart framing: raise both
#    together), a request rate and a number of uploads at a time per client, Stump's own origin,
#    and the pass every public request needs. Nothing else on the public listener takes a body
#    over 256 KB (GraphQL) or 25 MB. Stump itself holds an upload to its quotas, its checker and
#    the owner's approval (DEPLOY.md, "Enable friend uploads").
# Edit in place, then: docker exec stump-edge nginx -t -c /etc/nginx/edge/nginx.conf && docker exec stump-edge nginx -s reload -c /etc/nginx/edge/nginx.conf
# (a changed volume or EDGE_KEY needs `docker compose up -d --force-recreate stump-edge`)

load_module modules/ngx_http_js_module.so;
env EDGE_KEY;
env EDGE_COOKIE;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

http {
	server_tokens off;
	access_log off;

	client_body_temp_path /tmp/client_body;
	proxy_temp_path       /tmp/proxy;
	fastcgi_temp_path     /tmp/fastcgi;
	uwsgi_temp_path       /tmp/uwsgi;
	scgi_temp_path        /tmp/scgi;

	# Docker's DNS: follow stump-fork's address when the container is recreated
	resolver 127.0.0.11 valid=10s ipv6=off;

	# Only the compose network gateway may tell us the real client IP: that is how loopback
	# connections from the host (tailscaled for serve/Funnel, book-curator) arrive.
	# tailscaled replaces any client-sent X-Forwarded-For with the real client IP.
	set_real_ip_from 192.168.192.1;
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;

	map $realip_remote_addr $edge_peer_trusted {
		192.168.192.1 1;
		default       0;
	}
	# Scheme for Stump's generated URLs on home: trust X-Forwarded-Proto only from the host (tailscaled)
	map "$edge_peer_trusted:$http_x_forwarded_proto" $home_proto {
		"~^1:(?<p>https?)$" $p;
		default             $scheme;
	}

	# Rate-limit key: an IPv6 client counts as its whole /64, so it can't rotate addresses
	map $remote_addr $pub_client {
		"~^(?<v6>[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){3}):" $v6;
		"~^(?<v6>[0-9a-f:]+?)::"                       $v6;
		default                                        $remote_addr;
	}

	# Upgrade / Connection for every location, from one map (an ordinary request sends neither)
	map $http_upgrade $proxy_connection {
		default upgrade;
		''      "";
	}

	# Websocket (GraphQL subscriptions) only from Stump's own pages
	map $http_origin $ws_origin_public {
		""                                 1;
		"https://g3.tail3e401.ts.net:8443" 1;
		default                            0;
	}
	# the upload route takes a POST from Stump's own page only: its Origin (when the browser sends
	# one) is the public address, and Sec-Fetch-Site (when it sends one) says same-origin. A client
	# that is not a browser (a script with a token) sends neither
	map $http_origin $upload_origin_ok {
		""                                 1;
		"https://g3.tail3e401.ts.net:8443" 1;
		default                            0;
	}
	map $http_sec_fetch_site $upload_site_ok {
		""           1;
		same-origin  1;
		default      0;
	}
	map $http_origin $ws_origin_home {
		""                                                  1;
		"https://g3.tail3e401.ts.net:10802"                 1;
		"~^http://(localhost|127\.0\.0\.1|192\.168\.0\.17|g3)(:10801)?$" 1;
		default                                             0;
	}

	# an invite token travels in the path of /api/_i/… (or in ?t= when pasted): never log it
	map $uri $log_uri {
		default        $uri;
		"~^/api/_i/"   "/api/_i/-hidden-";
	}
	log_format edge '$time_iso8601 $server_port ip=$remote_addr peer=$realip_remote_addr '
		'xff="$http_x_forwarded_for" funnel="$http_tailscale_funnel_request" '
		'dev=$edge_device "$request_method $log_uri" $status $body_bytes_sent ${request_time}s ua="$http_user_agent"';

	# home traffic: log only errors and auth calls (the reader makes many requests)
	map "$status:$uri" $loggable_home {
		"~^(4|5)"           1;
		"~:/api/v2/auth/"   1;
		default             0;
	}

	# ---- device pass (stump-gate.js; the app writes /etc/nginx/state/state.json) ----
	js_import gate from /etc/nginx/edge/stump-gate.js;
	js_set $edge_device gate.device;
	js_set $edge_pass   gate.pass_header;
	js_set $edge_renew  gate.renew;
	js_set $edge_signin gate.signin;
	js_shared_dict_zone zone=edge_signin:64k type=number timeout=172800s evict;
	js_shared_dict_zone zone=edge_state:256k type=string;     # the app's state file (revoked, budgets)
	map $edge_device $edge_revoked { default 0; include /etc/nginx/edge/revoked.map; }   # break-glass: lines like "ana-phone 1;"
	# what a browser without a valid pass may still fetch: invite links, and the two static files
	# browsers fetch without cookies
	map "$edge_device:$edge_revoked:$uri" $edge_deny {
		default                                                                          1;
		"~^[a-z0-9-]+:0:"                                                                0;  # valid pass
		"~^[a-z0-9-]*:[01]:/api/_i/"                                                     0;  # invite links
		"~^[a-z0-9-]*:[01]:/assets/(manifest\.webmanifest|favicon-[0-9]+x[0-9]+\.png)$" 0;  # fetched without cookies
	}
	# Stump only ever sees its own session cookie (never the pass or other apps' cookies)
	map $cookie_stump_session $stump_cookie { "" ""; default "stump_session=$cookie_stump_session"; }

	# ---- limits ----
	limit_req_zone  $pub_client zone=pub_req:10m     rate=20r/s;
	limit_req_zone  $pub_client zone=pub_login:10m   rate=6r/m;
	limit_req_zone  $pub_client zone=pub_refresh:10m rate=30r/m;
	limit_req_zone  $pub_client zone=pub_invite:1m   rate=6r/m;
	# books: one request is one loose book (or a folder, or a .zip) and the web app sends them
	# one at a time; a 429 here is retried by the app after a moment. A few uploads at a time per
	# client and in all (a slow phone holds one for minutes)
	limit_req_zone  $pub_client zone=pub_upload:1m   rate=12r/m;
	limit_conn_zone $pub_client zone=pub_upload_conn:1m;
	limit_conn_zone $server_port zone=pub_upload_all:1m;
	limit_conn_zone $pub_client zone=pub_conn:10m;
	# all public clients together
	limit_req_zone  $server_port zone=pub_login_all:1m rate=30r/m;
	limit_conn_zone $server_port zone=pub_conn_all:1m;
	# GraphQL: few at a time per client and overall (Stump prices a query by its cost, and the edge
	# bounds how many run at once)
	limit_conn_zone $pub_client  zone=pub_gql:10m;
	limit_conn_zone $server_port zone=pub_gql_all:1m;
	limit_conn_zone $binary_remote_addr zone=home_gql:10m;

	# GraphQL only takes JSON (or multipart uploads): blocks text/plain cross-site POSTs (audit L9)
	map "$request_method:$content_type" $gql_bad_ctype {
		"~*^POST:(application/json|multipart/form-data)" 0;
		"~^POST:"                                         1;
		default                                           0;
	}
	limit_req_status  429;
	limit_conn_status 429;
	limit_req_log_level warn;

	upstream stump {
		zone stump 64k;
		server stump-fork:10801 resolve;
		keepalive 16;
	}

	proxy_http_version 1.1;
	proxy_buffering off;              # stream pages/books straight through, SSE friendly
	proxy_request_buffering off;      # no body spooling in nginx (Stump answers 401 before reading a body)
	proxy_connect_timeout 5s;
	proxy_read_timeout 120s;          # first render of a large PDF page can be slow
	proxy_send_timeout 120s;

	# ---------------- home: LAN, localhost, tailnet ----------------
	server {
		listen 8080;
		access_log /dev/stdout edge if=$loggable_home;

		# an "Add books" request is at most intake_max_request_mb (300 by default) + 1 MB of framing;
		# a library upload (max_file_upload_size) is smaller. Raise this with intake_max_request_mb
		client_max_body_size 301m;

		# Funnel must only ever reach the public listener
		if ($http_tailscale_funnel_request) { return 404; }

		# ---- what Stump sees, set once here; locations must not set proxy_set_header ----
		proxy_set_header Host                $http_host;
		proxy_set_header X-Forwarded-Proto   $home_proto;
		proxy_set_header X-Real-IP           $remote_addr;
		proxy_set_header X-Forwarded-For     $remote_addr;
		proxy_set_header Forwarded           "";
		proxy_set_header X-Forwarded-Host    "";
		proxy_set_header X-Forwarded-Port    "";
		proxy_set_header Cookie              $stump_cookie;
		# never let a client pretend to be the public edge, or to hold a pass
		proxy_set_header X-Edge-Public       "";
		proxy_set_header X-Edge-Pass         "";
		proxy_set_header Upgrade             $http_upgrade;
		proxy_set_header Connection          $proxy_connection;

		location = /api/graphql {
			if ($gql_bad_ctype) { return 415; }
			limit_conn home_gql 8;
			proxy_read_timeout 60s;
			proxy_pass http://stump;
		}

		location /api/graphql/ws {
			if ($ws_origin_home = 0) { return 403; }
			proxy_read_timeout 1h;
			proxy_pass http://stump;
		}

		location / {
			proxy_pass http://stump;
		}
	}

	# ---------------- public: Tailscale Funnel only ----------------
	server {
		listen 8081;
		access_log /dev/stdout edge;

		client_max_body_size 25m;     # avatars and such; books have their own location below
		client_header_timeout 10s;
		client_body_timeout 20s;
		send_timeout 60s;
		keepalive_timeout 30s;

		limit_conn pub_conn 30;
		limit_conn pub_conn_all 200;
		# safety net: any location without its own limit_req inherits this one
		limit_req zone=pub_req burst=300 nodelay;

		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options SAMEORIGIN always;
		add_header Referrer-Policy same-origin always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		# every port on g3.tail3e401.ts.net is HTTPS (tailscale serve), so HSTS is safe
		add_header Strict-Transport-Security "max-age=31536000" always;
		proxy_cookie_flags ~ secure;

		# ---- what Stump sees, set once here; locations must not set proxy_set_header ----
		proxy_set_header Host                g3.tail3e401.ts.net:8443;
		proxy_set_header X-Forwarded-Proto   https;
		proxy_set_header X-Real-IP           $remote_addr;
		proxy_set_header X-Forwarded-For     $remote_addr;
		proxy_set_header Forwarded           "";
		proxy_set_header X-Forwarded-Host    "";
		proxy_set_header X-Forwarded-Port    "";
		proxy_set_header Cookie              $stump_cookie;
		# every request from the internet says so (Stump then refuses the owner's password, the
		# owner's session, registration and the admin pages); the pass only when it is valid and
		# not revoked (empty = the header is not sent; a client's own value is replaced either way)
		proxy_set_header X-Edge-Public       1;
		proxy_set_header X-Edge-Pass         $edge_pass;
		proxy_set_header Upgrade             $http_upgrade;
		proxy_set_header Connection          $proxy_connection;

		# a path segment that starts or ends with whitespace, or any control character: never valid
		if ($uri ~ "(^|/)\s|\s(/|$)|[\x00-\x1f\x7f]") { return 404; }

		# ---- device pass: without a valid pass nothing is served, not even the sign-in page ----
		default_type text/html;
		absolute_redirect off;
		add_header Set-Cookie $edge_renew always;      # a pass in use is renewed once a day
		if ($edge_deny) { return 404 '<!doctype html><meta name=viewport content="width=device-width"><title>Private</title><p>Private site. Open your invite link in this browser, or paste it here:</p><form action=/api/_i/><input name=t size=30> <button>Open</button></form>'; }

		# invite pages are the app's: GET shows a button (spends nothing), POST redeems and sets the
		# pass. Its own header set: an `add_header` here replaces the server-level ones, so the pass
		# the app sets is not overwritten by a renewal of an older one, and the app's own headers
		# (no-referrer, no-store, CSP, nosniff, DENY) are the only copies
		location ^~ /api/_i/ {
			add_header Strict-Transport-Security "max-age=31536000" always;
			# the request line holds the invite token: keep it out of the error log too
			limit_req_log_level info;
			error_log /dev/stderr crit;
			limit_req zone=pub_invite burst=4 nodelay;
			client_max_body_size 8k;
			proxy_pass http://stump;
		}

		# follow the app's state file (revoked devices, budget resets) once a second; not reachable
		location @periodic { js_periodic gate.poll interval=1s; }

		# fetched by browsers without cookies; a fixed path, so nothing else rides on the exemption
		location ~ ^/assets/(manifest\.webmanifest|favicon-[0-9]+x[0-9]+\.png)$ {
			proxy_pass http://stump/assets/$1;
		}

		# Stump's HTTP Basic login (OPDS) has no lockout and no attempt log: never from the internet
		if ($http_authorization ~* "^\s*basic") { return 403; }

		# OPDS (Basic auth) and the device sync APIs stay on the LAN / tailnet
		location ~* ^/(opds|koreader|kobo)(/|$) { return 403; }
		# new users are created by the owner from home
		location ~* ^/api/v2/auth/register { return 403; }
		# the owner's admin pages are for home: a page of the app, and nothing the web app needs here
		location ~* ^/settings/access { return 404; }
		# unauthenticated extras the web app doesn't need (check-for-update calls GitHub each time)
		location ~* ^/api/v2/(check-for-update|health|version)(/|$) { return 404; }

		location ~* ^/api/v2/auth/login$ {
			limit_req zone=pub_login burst=4 nodelay;
			limit_req zone=pub_login_all burst=10 nodelay;
			if ($edge_signin = 0) { return 429; }   # 8 sign-in POSTs per device per UTC day
			client_max_body_size 4k;
			proxy_pass http://stump;
		}

		location ~* ^/api/v2/auth/refresh-token$ {
			limit_req zone=pub_refresh burst=10 nodelay;
			client_max_body_size 8k;
			proxy_pass http://stump;
		}

		# friends' books: the "Add books" inbox, the only way a book comes in from the internet.
		# Stump streams the body to disk and holds it to its own limits (the per-request size,
		# the user's quota, the files and items, the checker, the owner's approval); this adds
		# the size cap that matches (nothing is spooled here: proxy_request_buffering is off),
		# a request rate per client, few uploads at a time, and Stump's own origin. The pass is
		# the server-level check above. Its refusals (413, 429) come before Stump reads a byte
		location = /api/v2/intake/upload {
			if ($upload_origin_ok = 0) { return 403; }
			if ($upload_site_ok = 0)   { return 403; }
			limit_req zone=pub_upload burst=6 nodelay;
			limit_conn pub_upload_conn 2;
			limit_conn pub_upload_all 8;
			client_max_body_size 301m;      # intake_max_request_mb (300) + 1 MB of framing
			client_body_timeout 60s;        # as long as Stump waits for a stalled file (60 s)
			proxy_request_buffering off;
			proxy_read_timeout 120s;
			error_page 429 = @upload_slow;
			proxy_pass http://stump;
		}

		# a 429 from the edge says when to try again (the web app waits that long). Its body is the
		# default one and carries no Stump-style message: the app tells the edge's rate limit,
		# which lifts, from Stump's own limits on files and items, which a new try does not change
		location @upload_slow {
			internal;
			add_header Retry-After 10 always;
			add_header Strict-Transport-Security "max-age=31536000" always;
			add_header X-Content-Type-Options nosniff always;
			return 429;
		}

		# GraphQL: few at a time per client and overall, and a hard time cap (Stump cancels the
		# query when the connection closes). A query is small; the biggest is a review of a book
		# (a description of 20,000 characters, up to 4 bytes each in JSON, and the rest of the form)
		location = /api/graphql {
			if ($gql_bad_ctype) { return 415; }
			limit_req zone=pub_req burst=100 nodelay;
			limit_conn pub_gql 4;
			limit_conn pub_gql_all 12;
			client_max_body_size 256k;
			proxy_read_timeout 20s;
			proxy_pass http://stump;
		}

		location /api/graphql/ws {
			if ($ws_origin_public = 0) { return 403; }
			limit_req zone=pub_req burst=20 nodelay;
			proxy_read_timeout 1h;
			proxy_pass http://stump;
		}

		location / {
			# a library grid loads many covers at once: generous burst, then 20/s
			limit_req zone=pub_req burst=300 nodelay;
			proxy_pass http://stump;
		}
	}
}
