input FieldFilterFileStatus @oneOf {
	eq: FileStatus
	neq: FileStatus
	anyOf: [FileStatus!]
	noneOf: [FileStatus!]
	like: FileStatus
	likeAnyOf: [FileStatus!]
	likeNoneOf: [FileStatus!]
	contains: FileStatus
	excludes: FileStatus
	startsWith: FileStatus
	endsWith: FileStatus
	"""
	Matches when a comma-separated list column (e.g. genres, writers) contains at
	least one of the given values as a whole element. Unlike `likeAnyOf`, the value
	`Science` does not match `Science fiction`.
	"""
	hasAnyOf: [FileStatus!]
	"Matches when none of the given values is a whole element of the list column"
	hasNoneOf: [FileStatus!]
}

input FieldFilterString @oneOf {
	eq: String
	neq: String
	anyOf: [String!]
	noneOf: [String!]
	like: String
	likeAnyOf: [String!]
	likeNoneOf: [String!]
	contains: String
	excludes: String
	startsWith: String
	endsWith: String
	"""
	Matches when a comma-separated list column (e.g. genres, writers) contains at
	least one of the given values as a whole element. Unlike `likeAnyOf`, the value
	`Science` does not match `Science fiction`.
